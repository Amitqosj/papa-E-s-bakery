# Papa E's Bakery — Static Site on Render
# Docs: https://render.com/docs/static-sites

services:
  - type: web
    name: papa-es-bakery
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA-friendly: serve index.html for unknown paths (safe for Vite static apps)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
